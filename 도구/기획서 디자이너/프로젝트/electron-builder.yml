appId: com.deckdesigner.desktop
productName: 기획서 디자이너
directories:
  buildResources: build
files:
  - '!**/.DS_Store'
  - '!**/._*'
  # ffmpeg is copied by build/after-pack.cjs per platform so unused binaries are not bundled.
  # Linux currently has no bundled ffmpeg binary in resources/ffmpeg; MP4 export needs a Linux
  # ffmpeg asset before Linux video export can be enabled in packaged apps.
  - '!resources/ffmpeg/**'
  - '!**/.vscode/*'
  - '!**/.idea/**'
  - '!**/.git/**'
  - '!src/**'
  - '!tools/**'
  - '!scripts/**'
  - '!assets/**'
  - '!docs/**'
  - '!doc/**'
  - '!logs/**'
  - '!patch/**'
  - '!tpack/**'
  - '!dist/**'
  - '!.claude/**'
  - '!.pnpm-store/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!README_*'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
  - '!*.db'
  - '!*.db-*'
  - '!{deck-designer.dev.db,deck-designer.db,ohmyppt.dev.db,ohmyppt.db}'
  - '!thumb.png'
  - '!tests/**'
  - '!test/**'
asarUnpack:
  - resources/**
  - node_modules/@node-rs/**/*.node
  # Codex SDK spawns a platform-native binary; executables cannot run inside app.asar.
  - node_modules/@openai/codex*/**
afterPack: build/after-pack.cjs
extraResources:
  - from: build/icons/icon.ico
    to: icons/icon.ico
  - from: build/icons/32x32.png
    to: icons/32x32.png
  - from: build/icons/16x16.png
    to: icons/16x16.png
forceCodeSigning: false
win:
  target:
    - target: portable
      arch:
        - x64
  executableName: deck-designer
  icon: build/icons/icon.ico
  artifactName: deck-designer-${version}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icons/icon.icns
  identity: null
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # Packaging metadata is ready for Linux, but resources/ffmpeg currently only contains
  # macOS and Windows binaries. build/after-pack.cjs already looks for ffmpeg-linux-x64;
  # add that binary before advertising MP4 export support for Linux packages.
  executableName: deck-designer
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icons
  maintainer: Deck Designer Project
  vendor: Deck Designer Project
  category: Office
  synopsis: 논리에서 레이아웃까지 연결하는 기획서 설계 도구
  description: 원고의 논리와 근거를 추적하며 맥락에 맞는 디자인과 편집 가능한 PPTX, Word 문서로 연결하는 로컬 우선 도구입니다.
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
