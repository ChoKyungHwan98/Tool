  <style>
    * { box-sizing:border-box; }
    :root { --desk:#e7e5e0; --surface:#f7f7f4; --ink:#20252b; --muted:#69717a; --rule:#c9ccd0; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }

    a { color:inherit; text-decoration:none; }
    .app { height:100dvh; display:grid; grid-template-rows:50px 1fr 38px; }
    .topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; padding:0 20px; border-bottom:1px solid var(--rule); background:rgba(247,247,244,.97); }
    .brand { display:flex; align-items:baseline; gap:12px; white-space:nowrap; } .brand strong{font-size:13px}.brand span{color:var(--muted);font-size:12px}
    .switch { display:flex; gap:3px; padding:3px; border:1px solid #bfc3c6; border-radius:7px; background:#ecece8; }
    .switch a { min-width:34px; padding:5px 11px 6px; border-radius:4px; color:#687079; font:600 12px Bahnschrift,"Noto Sans KR",sans-serif; text-align:center; }
    .switch .active { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(32,37,43,.12); }
    .actions { justify-self:end; display:flex; align-items:center; gap:7px; font-size:12px; } .actions a,.actions span{min-height:30px;padding:6px 10px;border:1px solid transparent;border-radius:5px}.actions a{border-color:#bfc3c6;background:#fff}
    .workspace { min-height:0; display:flex; align-items:center; justify-content:center; padding:18px 32px 14px; }
    .slide-frame { width:min(calc(100vw - 96px), calc((100vh - 136px) * 16 / 9), 1500px); aspect-ratio:16/9; box-shadow:0 22px 55px rgba(47,49,51,.25),0 2px 4px rgba(32,37,43,.2); }
    .slide { position:relative; width:100%; height:100%; overflow:hidden; container-type:inline-size; background:#0c1e2c; color:#dce8ea; }
    .title { position:absolute; left:5.8%; top:7.2%; margin:0; font-size:2.65cqw; line-height:1.12; letter-spacing:-.045em; }
    .subtitle { position:absolute; right:5.8%; top:9.3%; color:#8fa8af; font-size:.95cqw; }
    .trace { position:absolute; left:5.8%; right:5.8%; top:28%; bottom:12%; }
    .trace svg { position:absolute; inset:0; width:100%; height:100%; }
    .pulse-label { position:absolute; left:3.5%; top:4%; color:#a9f0e4; font-size:1.08cqw; font-weight:700; }
    .fragment { position:absolute; left:27%; top:66%; color:#c8ece8; font-size:1.02cqw; font-weight:600; }
    .hold { position:absolute; left:44%; top:25%; width:23%; text-align:center; }
    .hold strong { display:block; color:#f2fbfa; font:700 4.5cqw Bahnschrift,sans-serif; letter-spacing:-.045em; }
    .hold span { display:block; margin-top:.5cqw; color:#a9f0e4; font-size:1.12cqw; font-weight:600; }
    .break { position:absolute; left:70.8%; top:12%; color:#ff6b57; font:700 2.2cqw Bahnschrift,sans-serif; letter-spacing:.06em; transform:rotate(-4deg); }
    .output { position:absolute; right:0; top:48%; width:24%; text-align:right; }
    .output strong { display:block; color:#ff8b78; font:700 3.85cqw Bahnschrift,sans-serif; letter-spacing:-.03em; }
    .output span { color:#dce8ea; font-size:1.08cqw; font-weight:600; }
    .slide-footer { position:absolute; left:5.8%; right:5.8%; bottom:5%; display:flex; justify-content:space-between; color:#79939c; font-size:.82cqw; }
    .status { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; padding:0 20px; border-top:1px solid var(--rule); background:var(--surface); color:#606870; font-size:11px; }
    .status strong{color:#273139;font-weight:600}.status-center{display:flex;gap:18px}.status-right{justify-self:end;color:#737b81}
    @media(max-width:1400px){.topbar{padding-inline:14px}.workspace{padding-inline:20px}.slide-frame{width:min(calc(100vw - 56px),calc((100vh - 132px)*16/9),1500px)}}
  </style>
</head>
